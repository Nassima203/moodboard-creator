<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Épingle — Créateur de moodboards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:wght@500;600&family=DM+Serif+Display&family=Manrope:wght@400;700&family=Archivo:wght@400;700&family=Caveat:wght@500;700&family=Kalam:wght@400;700&family=Permanent+Marker&family=Shadows+Into+Light&family=JetBrains+Mono:wght@400;700&family=Bebas+Neue&family=Unbounded:wght@400;700&family=Righteous&family=Sora:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --board:#e7e1d3;
    --board-dot:#d6cebb;
    --paper:#fbf9f3;
    --ink:#211f1b;
    --ink-soft:#5b574c;
    --line:#c9c1ac;
    --accent:#ff4b2e;
    --accent-ink:#5c1206;
    --accent-soft:#ffe0d6;
    --tape:#f2e6a8cc;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--board);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}
  .screen{display:none;flex:1;flex-direction:column;}
  .screen.active{display:flex;}

  .logo{
    font-family:'Fraunces',serif;
    font-weight:900;
    font-optical-sizing:auto;
    letter-spacing:-0.01em;
  }
  .logo .dot{color:var(--accent);}

  /* ---------- AUTH ---------- */
  #screen-auth{align-items:center;justify-content:center;padding:32px 20px;min-height:100vh;}
  .auth-card{
    width:100%;max-width:360px;background:var(--paper);
    border:1px solid var(--line);border-radius:2px;
    padding:36px 28px 28px;
    position:relative;
    box-shadow:0 1px 0 rgba(0,0,0,0.04);
  }
  .auth-card::before{
    content:"";position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-2deg);
    width:64px;height:22px;background:var(--tape);
  }
  .auth-title{font-size:30px;margin:0 0 4px;}
  .auth-sub{font-size:13px;color:var(--ink-soft);margin:0 0 24px;line-height:1.5;}
  .field-label{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft);display:block;margin:0 0 6px;}
  input[type=text], input[type=password]{
    width:100%;padding:11px 12px;font-family:'Space Grotesk',sans-serif;font-size:15px;
    border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--ink);
  }
  input[type=text]:focus, input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .btn{
    font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:14px;
    border-radius:2px;border:1px solid var(--ink);background:transparent;color:var(--ink);
    padding:10px 18px;cursor:pointer;transition:transform .08s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn:hover{background:var(--ink);color:var(--paper);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff;}
  .btn-full{width:100%;}
  .btn-icon{border:none;background:transparent;cursor:pointer;color:var(--ink-soft);padding:6px;border-radius:2px;}
  .btn-icon:hover{background:rgba(0,0,0,0.06);color:var(--ink);}

  .profiles{margin:22px 0;}
  .profile-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 12px;border:1px solid var(--line);border-radius:2px;margin-bottom:8px;
    background:#fff;cursor:pointer;
  }
  .profile-row:hover{border-color:var(--ink);}
  .profile-name{font-weight:500;font-size:14px;}
  .profile-meta{font-family:'Space Mono',monospace;font-size:11px;color:var(--ink-soft);}
  .auth-divider{display:flex;align-items:center;gap:10px;margin:20px 0;color:var(--ink-soft);font-size:11px;text-transform:uppercase;letter-spacing:0.08em;}
  .auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:var(--line);}

  /* ---------- HEADER (dashboard + editor) ---------- */
  header.topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;border-bottom:1px solid var(--line);
    background:var(--board);position:sticky;top:0;z-index:40;
  }
  .topbar-left{display:flex;align-items:center;gap:14px;}
  .topbar-logo{font-size:20px;}
  .who{font-family:'Space Mono',monospace;font-size:11px;color:var(--ink-soft);}
  .topbar-right{display:flex;align-items:center;gap:8px;}

  /* ---------- DASHBOARD ---------- */
  #screen-dashboard main{padding:24px 20px 60px;max-width:900px;margin:0 auto;width:100%;}
  .dash-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .dash-head h1{font-family:'Fraunces',serif;font-size:26px;margin:0;}
  .dash-count{font-family:'Space Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;}
  .card{
    background:var(--paper);border:1px solid var(--line);border-radius:2px;
    cursor:pointer;overflow:hidden;transition:border-color .12s ease, transform .12s ease;
    position:relative;
  }
  .card:hover{border-color:var(--ink);transform:translateY(-2px);}
  .card-preview{height:110px;position:relative;background:
    linear-gradient(45deg,var(--board-dot) 25%,transparent 25%,transparent 75%,var(--board-dot) 75%),
    linear-gradient(45deg,var(--board-dot) 25%,transparent 25%,transparent 75%,var(--board-dot) 75%);
    background-size:14px 14px;background-position:0 0,7px 7px;background-color:var(--board);
    display:flex;align-items:center;padding:10px;gap:6px;overflow:hidden;
  }
  .swatch-chip{width:26px;height:26px;border-radius:2px;flex-shrink:0;border:1px solid rgba(0,0,0,0.1);}
  .card-body{padding:12px 14px 14px;}
  .card-name{font-weight:500;font-size:15px;margin:0 0 4px;}
  .card-date{font-family:'Space Mono',monospace;font-size:11px;color:var(--ink-soft);margin:0;}
  .card-del{position:absolute;top:8px;right:8px;background:rgba(255,255,255,0.85);border-radius:2px;}
  .new-card{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    border:1.5px dashed var(--line);background:transparent;min-height:172px;
  }
  .new-card:hover{border-color:var(--ink);}
  .new-card span{font-size:13px;color:var(--ink-soft);}
  .empty{padding:60px 20px;text-align:center;color:var(--ink-soft);}
  .empty h2{font-family:'Fraunces',serif;font-size:22px;color:var(--ink);margin-bottom:6px;}

  /* ---------- EDITOR ---------- */
  #screen-editor{height:100vh;}
  .editor-name-wrap{display:flex;align-items:center;gap:6px;min-width:0;}
  #board-name-input{
    font-family:'Fraunces',serif;font-size:18px;border:none;background:transparent;
    color:var(--ink);max-width:38vw;padding:2px 4px;border-radius:2px;
  }
  #board-name-input:focus{outline:1px solid var(--line);background:#fff;}
  .save-status{font-family:'Space Mono',monospace;font-size:10px;color:var(--ink-soft);white-space:nowrap;}

  .canvas-wrap{flex:1;overflow:auto;position:relative;}
  #canvas{
    position:relative;
    width:1600px;height:1400px;
    background-color:var(--board);
    background-image:radial-gradient(var(--board-dot) 1.4px, transparent 1.4px);
    background-size:22px 22px;
  }

  .toolbar{
    position:sticky;bottom:0;left:0;right:0;z-index:30;
    display:flex;justify-content:center;padding:14px 12px;
    pointer-events:none;
  }
  .toolbar-inner{
    pointer-events:auto;
    display:flex;gap:6px;background:var(--ink);border-radius:40px;
    padding:8px;box-shadow:0 6px 20px rgba(0,0,0,0.22);
  }
  .tool-btn{
    display:flex;align-items:center;gap:7px;background:transparent;border:none;
    color:#fbf9f3;padding:9px 14px;border-radius:30px;cursor:pointer;font-family:'Space Grotesk',sans-serif;
    font-size:13px;font-weight:500;white-space:nowrap;
  }
  .tool-btn:hover{background:rgba(255,255,255,0.14);}
  .tool-btn.emphasis{background:var(--accent);}
  .tool-btn.emphasis:hover{background:var(--accent-ink);}
  .tool-icon{width:16px;height:16px;flex-shrink:0;}

  /* ---------- ELEMENTS ON BOARD ---------- */
  .el{
    position:absolute;cursor:grab;user-select:none;touch-action:none;
  }
  .el.dragging{cursor:grabbing;z-index:200 !important;}
  .el.selected .el-frame{outline:2px solid var(--accent);outline-offset:3px;}
  .el-pin{
    position:absolute;top:-7px;left:50%;transform:translateX(-50%);
    width:10px;height:10px;border-radius:50%;background:var(--accent);
    box-shadow:0 2px 3px rgba(0,0,0,0.35);z-index:2;
  }
  .el-tape{
    position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-1.5deg);
    width:56px;height:20px;background:var(--tape);z-index:2;
    box-shadow:0 1px 2px rgba(0,0,0,0.15);
  }
  .el-frame{
    background:var(--paper);padding:8px;border-radius:1px;
    box-shadow:0 3px 10px rgba(0,0,0,0.16);
    width:100%;height:100%;display:flex;flex-direction:column;
  }
  .el-img-wrap{flex:1;overflow:hidden;background:#e9e5d8;}
  .el-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
  .el-text-frame{background:var(--paper);box-shadow:0 3px 10px rgba(0,0,0,0.16);width:100%;height:100%;padding:14px;overflow:hidden;}
  .el-text-content{width:100%;height:100%;outline:none;overflow:hidden;word-wrap:break-word;}
  .el-color-frame{width:100%;height:100%;border-radius:1px;box-shadow:0 3px 10px rgba(0,0,0,0.16);position:relative;display:flex;align-items:flex-end;padding:10px;}
  .el-color-tag{
    font-family:'Space Mono',monospace;font-size:12px;font-weight:700;
    background:rgba(255,255,255,0.88);padding:3px 8px;border-radius:20px;
  }
  .resize-handle{
    position:absolute;right:-6px;bottom:-6px;width:16px;height:16px;
    background:var(--ink);border:2px solid var(--paper);border-radius:50%;cursor:nwse-resize;z-index:3;
  }
  .el-toolbar{
    position:absolute;top:-42px;left:50%;transform:translateX(-50%);
    display:flex;gap:4px;background:var(--ink);border-radius:20px;padding:5px;
    z-index:10;white-space:nowrap;
  }
  .el-toolbar button{background:transparent;border:none;color:#fbf9f3;cursor:pointer;padding:5px 7px;border-radius:14px;font-size:12px;display:flex;align-items:center;}
  .el-toolbar button:hover{background:rgba(255,255,255,0.16);}
  .el-toolbar select{
    background:#2c2a25;color:#fbf9f3;border:none;border-radius:12px;font-size:11px;padding:5px 8px;
    font-family:'Space Grotesk',sans-serif;max-width:110px;
  }
  .el-toolbar input[type=color]{width:24px;height:24px;border:none;background:none;padding:0;cursor:pointer;}

  .hint-empty{
    position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);
    text-align:center;color:var(--ink-soft);pointer-events:none;width:280px;
  }
  .hint-empty h3{font-family:'Fraunces',serif;font-size:20px;color:var(--ink);margin-bottom:6px;}
  .hint-empty p{font-size:13px;line-height:1.5;}

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(33,31,27,0.55);z-index:100;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .modal-overlay.active{display:flex;}
  .modal-box{background:var(--paper);border-radius:2px;padding:26px;max-width:340px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,0.3);}
  .modal-box h3{font-family:'Fraunces',serif;font-size:20px;margin:0 0 4px;}
  .modal-box p{font-size:13px;color:var(--ink-soft);margin:0 0 16px;line-height:1.5;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}

  .toast{
    position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:20px;
    font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;z-index:300;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (max-width:640px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
    .tool-btn span{display:none;}
    .tool-btn{padding:11px;}
    #board-name-input{max-width:32vw;font-size:15px;}
  }
</style>
</head>
<body>
<div id="app">

  <!-- AUTH SCREEN -->
  <section id="screen-auth" class="screen active">
    <div class="auth-card">
      <div class="logo auth-title">Épingle<span class="dot">.</span></div>
      <p class="auth-sub">Ton atelier de moodboards — images, typographies et couleurs, épinglées.</p>

      <label class="field-label" for="auth-email">Email</label>
      <input type="text" id="auth-email" placeholder="toi@exemple.com" autocomplete="email">
      <label class="field-label" for="auth-password" style="margin-top:12px;">Mot de passe</label>
      <input type="password" id="auth-password" placeholder="6 caractères minimum" autocomplete="current-password">
      <p id="auth-error" style="font-size:12px;color:var(--accent-ink);margin:8px 0 0;display:none;"></p>

      <button class="btn btn-primary btn-full" id="btn-login" style="margin-top:16px;">Se connecter</button>
      <div class="auth-divider">ou</div>
      <button class="btn btn-full" id="btn-signup">Créer un compte</button>
      <p id="auth-hint" style="font-size:11px;color:var(--ink-soft);margin-top:14px;line-height:1.5;"></p>
    </div>
  </section>

  <!-- DASHBOARD -->
  <section id="screen-dashboard" class="screen">
    <header class="topbar">
      <div class="topbar-left">
        <span class="logo topbar-logo">Épingle<span class="dot">.</span></span>
      </div>
      <div class="topbar-right">
        <span class="who" id="who-label"></span>
        <button class="btn-icon" id="btn-logout" title="Changer de profil">↩</button>
      </div>
    </header>
    <main>
      <div class="dash-head">
        <h1>Mes projets</h1>
        <span class="dash-count" id="project-count"></span>
      </div>
      <div class="grid" id="projects-grid"></div>
    </main>
  </section>

  <!-- EDITOR -->
  <section id="screen-editor" class="screen">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn-icon" id="btn-back" title="Retour aux projets">←</button>
        <div class="editor-name-wrap">
          <input type="text" id="board-name-input" value="Sans titre">
        </div>
      </div>
      <div class="topbar-right">
        <span class="save-status" id="save-status">non enregistré</span>
        <button class="btn btn-primary" id="btn-save">Enregistrer</button>
      </div>
    </header>
    <div class="canvas-wrap">
      <div id="canvas">
        <div class="hint-empty" id="hint-empty">
          <h3>Tableau vide</h3>
          <p>Utilise la barre en bas pour épingler une image, un mot ou une couleur.</p>
        </div>
      </div>
    </div>
    <div class="toolbar">
      <div class="toolbar-inner">
        <button class="tool-btn" id="btn-add-image">
          <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          <span>Image</span>
        </button>
        <button class="tool-btn" id="btn-add-text">
          <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
          <span>Texte</span>
        </button>
        <button class="tool-btn" id="btn-add-color">
          <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
          <span>Couleur</span>
        </button>
      </div>
    </div>
    <input type="file" id="file-input" accept="image/*" style="display:none;">
  </section>

</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box" id="modal-box"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){

  var FONTS = [
    {label:"Fraunces", value:"'Fraunces', serif"},
    {label:"Playfair Display", value:"'Playfair Display', serif"},
    {label:"Cormorant Garamond", value:"'Cormorant Garamond', serif"},
    {label:"DM Serif Display", value:"'DM Serif Display', serif"},
    {label:"Space Grotesk", value:"'Space Grotesk', sans-serif"},
    {label:"Manrope", value:"'Manrope', sans-serif"},
    {label:"Archivo", value:"'Archivo', sans-serif"},
    {label:"Sora", value:"'Sora', sans-serif"},
    {label:"Caveat", value:"'Caveat', cursive"},
    {label:"Kalam", value:"'Kalam', cursive"},
    {label:"Permanent Marker", value:"'Permanent Marker', cursive"},
    {label:"Shadows Into Light", value:"'Shadows Into Light', cursive"},
    {label:"Space Mono", value:"'Space Mono', monospace"},
    {label:"JetBrains Mono", value:"'JetBrains Mono', monospace"},
    {label:"Bebas Neue", value:"'Bebas Neue', sans-serif"},
    {label:"Unbounded", value:"'Unbounded', sans-serif"},
    {label:"Righteous", value:"'Righteous', cursive"}
  ];

  var COLOR_PRESETS = ["#E7DCC8","#C9502F","#3452EB","#1D9E75","#211F1B","#F2C879","#D4537E","#5F5E5A","#97C459","#7F77DD"];

  var state = {
    user: null,
    board: null,
    selectedId: null,
    savedSnapshot: null
  };

  function $(sel){ return document.querySelector(sel); }
  function $all(sel){ return Array.prototype.slice.call(document.querySelectorAll(sel)); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function showScreen(name){
    $all('.screen').forEach(function(s){ s.classList.remove('active'); });
    $('#screen-' + name).classList.add('active');
  }

  function toast(msg){
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  // ---------- MODAL ----------
  function openModal(html, onMount){
    $('#modal-box').innerHTML = html;
    $('#modal-overlay').classList.add('active');
    if(onMount) onMount($('#modal-box'));
  }
  function closeModal(){
    $('#modal-overlay').classList.remove('active');
    $('#modal-box').innerHTML = '';
  }
  $('#modal-overlay').addEventListener('click', function(e){
    if(e.target === $('#modal-overlay')) closeModal();
  });

  function confirmModal(title, desc, confirmLabel, onConfirm){
    openModal(
      '<h3>'+title+'</h3><p>'+desc+'</p>' +
      '<div class="modal-actions"><button class="btn" id="m-cancel">Annuler</button>' +
      '<button class="btn btn-primary" id="m-confirm">'+confirmLabel+'</button></div>'
    , function(box){
      box.querySelector('#m-cancel').addEventListener('click', closeModal);
      box.querySelector('#m-confirm').addEventListener('click', function(){ closeModal(); onConfirm(); });
    });
  }

  // ---------- SUPABASE CONFIG ----------
  // Remplace ces deux valeurs par celles de Project Settings > API dans Supabase
  var SUPABASE_URL = 'https://ajvklowhtodenkpxalir.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqdmtsb3dodG9kZW5rcHhhbGlyIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NzIyNzYzMCwiZXhwIjoyMTAyODAzNjMwfQ.xrv5oZFHUqmzS1H4tjuNHUZYzvsc9aMmF-za8Uv6eyI';
  var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function escapeHtml(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }

  // ---------- AUTH ----------
  function showAuthError(msg){
    var el = $('#auth-error');
    el.textContent = msg;
    el.style.display = msg ? 'block' : 'none';
  }

  async function renderAuthScreen(){
    showAuthError('');
    $('#auth-hint').textContent = 'Ton mot de passe est géré par Supabase, jamais stocké en clair.';
    var session = await supabase.auth.getSession();
    if(session.data.session){
      login(session.data.session.user);
    }
  }

  async function login(user){
    state.user = user;
    $('#who-label').textContent = user.email;
    showScreen('dashboard');
    await renderDashboard();
  }

  $('#btn-signup').addEventListener('click', async function(){
    var email = $('#auth-email').value.trim();
    var password = $('#auth-password').value;
    if(!email || password.length < 6){
      showAuthError('Entre un email et un mot de passe de 6 caractères minimum.');
      return;
    }
    showAuthError('');
    var res = await supabase.auth.signUp({ email: email, password: password });
    if(res.error){ showAuthError(res.error.message); return; }
    if(res.data.session){
      login(res.data.session.user);
    } else {
      toast('Compte créé. Vérifie ta boîte mail pour confirmer, puis connecte-toi.');
    }
  });

  $('#btn-login').addEventListener('click', async function(){
    var email = $('#auth-email').value.trim();
    var password = $('#auth-password').value;
    if(!email || !password){
      showAuthError('Entre ton email et ton mot de passe.');
      return;
    }
    showAuthError('');
    var res = await supabase.auth.signInWithPassword({ email: email, password: password });
    if(res.error){ showAuthError(res.error.message); return; }
    login(res.data.session.user);
  });

  $('#btn-logout').addEventListener('click', async function(){
    await supabase.auth.signOut();
    state.user = null;
    $('#auth-email').value = '';
    $('#auth-password').value = '';
    showScreen('auth');
    renderAuthScreen();
  });

  // ---------- DASHBOARD ----------
  async function loadBoardsIndex(){
    var res = await supabase
      .from('moodboards')
      .select('id, name, elements, updated_at')
      .order('updated_at', { ascending: false });
    if(res.error){ toast("Impossible de charger tes moodboards."); return []; }
    return res.data.map(function(b){
      var colors = (b.elements || []).filter(function(e){ return e.type === 'color'; }).map(function(e){ return e.hex; });
      return { id: b.id, name: b.name, updatedAt: new Date(b.updated_at).getTime(), elementCount: (b.elements||[]).length, colors: colors };
    });
  }

  async function renderDashboard(){
    var boards = await loadBoardsIndex();
    $('#project-count').textContent = boards.length + (boards.length > 1 ? ' moodboards' : ' moodboard');

    var grid = $('#projects-grid');
    var html = '<button class="card new-card" id="card-new"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>Nouveau moodboard</span></button>';

    html += boards.map(function(b){
      var swatches = (b.colors || []).slice(0,5).map(function(c){
        return '<div class="swatch-chip" style="background:'+c+'"></div>';
      }).join('');
      var date = b.updatedAt ? new Date(b.updatedAt).toLocaleDateString('fr-FR', {day:'numeric', month:'short'}) : '';
      return '<div class="card" data-id="'+b.id+'">' +
        '<div class="card-preview">'+ (swatches || '<span style="font-size:11px;color:var(--ink-soft);font-family:Space Mono,monospace;">tableau vide</span>') +'</div>' +
        '<div class="card-body"><p class="card-name">'+escapeHtml(b.name)+'</p><p class="card-date">'+ (b.elementCount||0) +' éléments · '+date+'</p></div>' +
        '<button class="btn-icon card-del" data-del="'+b.id+'" title="Supprimer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button>' +
        '</div>';
    }).join('');

    grid.innerHTML = html;

    $('#card-new').addEventListener('click', createNewBoard);
    $all('.card[data-id]').forEach(function(card){
      card.addEventListener('click', function(e){
        if(e.target.closest('[data-del]')) return;
        openBoard(card.getAttribute('data-id'));
      });
    });
    $all('[data-del]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var id = btn.getAttribute('data-del');
        confirmModal('Supprimer ce moodboard ?', 'Cette action est définitive, le tableau et son contenu seront perdus.', 'Supprimer', async function(){
          var res = await supabase.from('moodboards').delete().eq('id', id);
          if(res.error){ toast("La suppression a échoué."); return; }
          toast('Moodboard supprimé.');
          renderDashboard();
        });
      });
    });
  }

  async function createNewBoard(){
    state.board = { id: null, name: 'Sans titre', elements: [], updatedAt: Date.now() };
    state.savedSnapshot = null;
    showScreen('editor');
    renderEditor();
  }

  async function openBoard(id){
    var res = await supabase.from('moodboards').select('id, name, elements, updated_at').eq('id', id).single();
    if(res.error){ toast("Impossible de charger ce moodboard."); return; }
    state.board = { id: res.data.id, name: res.data.name, elements: res.data.elements || [], updatedAt: new Date(res.data.updated_at).getTime() };
    state.savedSnapshot = JSON.stringify(state.board.elements);
    showScreen('editor');
    renderEditor();
  }

  $('#btn-back').addEventListener('click', async function(){
    if(hasUnsavedChanges()){
      confirmModal('Quitter sans enregistrer ?', 'Les modifications non enregistrées seront perdues.', 'Quitter', function(){
        showScreen('dashboard'); renderDashboard();
      });
    } else {
      showScreen('dashboard'); renderDashboard();
    }
  });

  function hasUnsavedChanges(){
    if(!state.board) return false;
    return JSON.stringify(state.board.elements) !== state.savedSnapshot;
  }

  // ---------- EDITOR ----------
  function renderEditor(){
    $('#board-name-input').value = state.board.name;
    $('#save-status').textContent = state.savedSnapshot ? 'enregistré' : 'non enregistré';
    state.selectedId = null;
    var canvas = $('#canvas');
    canvas.innerHTML = '';
    canvas.appendChild(buildEmptyHint());
    state.board.elements.forEach(renderElement);
    updateEmptyHint();
  }

  function buildEmptyHint(){
    var d = document.createElement('div');
    d.className = 'hint-empty';
    d.id = 'hint-empty';
    d.innerHTML = '<h3>Tableau vide</h3><p>Utilise la barre en bas pour épingler une image, un mot ou une couleur.</p>';
    return d;
  }
  function updateEmptyHint(){
    var hint = $('#hint-empty');
    if(hint) hint.style.display = state.board.elements.length ? 'none' : 'block';
  }

  $('#board-name-input').addEventListener('input', function(e){
    state.board.name = e.target.value || 'Sans titre';
    markDirty();
  });

  function markDirty(){
    $('#save-status').textContent = 'non enregistré';
  }

  // ---- element factory ----
  function addElement(type){
    var canvasW = 1600, canvasH = 1400;
    var baseX = 120 + Math.random()*400;
    var baseY = 100 + Math.random()*300;
    var rotation = (Math.random()*8 - 4).toFixed(1);
    var el = { id: uid(), type: type, x: baseX, y: baseY, rotation: parseFloat(rotation) };

    if(type === 'text'){
      el.w = 220; el.h = 130;
      el.content = 'Nouveau mot';
      el.font = FONTS[0].value;
      el.size = 22;
      el.color = '#211F1B';
    } else if(type === 'color'){
      el.w = 150; el.h = 150;
      el.hex = COLOR_PRESETS[Math.floor(Math.random()*COLOR_PRESETS.length)];
    } else if(type === 'image'){
      el.w = 220; el.h = 240;
      el.src = null;
    }
    state.board.elements.push(el);
    renderElement(el);
    updateEmptyHint();
    markDirty();
    selectElement(el.id);
    return el;
  }

  function getEl(id){
    return state.board.elements.find(function(e){ return e.id === id; });
  }

  function renderElement(data){
    var node = document.createElement('div');
    node.className = 'el';
    node.id = 'el-' + data.id;
    node.style.left = data.x + 'px';
    node.style.top = data.y + 'px';
    node.style.width = data.w + 'px';
    node.style.height = data.h + 'px';
    node.style.transform = 'rotate(' + data.rotation + 'deg)';

    var inner = '';
    if(data.type === 'image'){
      inner += '<div class="el-tape"></div>';
      inner += '<div class="el-frame"><div class="el-img-wrap">' +
        (data.src ? '<img src="'+data.src+'" alt="">' : '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:11px;color:var(--ink-soft);font-family:Space Mono,monospace;">chargement...</div>') +
        '</div></div>';
    } else if(data.type === 'text'){
      inner += '<div class="el-pin"></div>';
      inner += '<div class="el-text-frame"><div class="el-text-content" contenteditable="true" style="font-family:'+data.font+';font-size:'+data.size+'px;color:'+data.color+';">'+escapeHtml(data.content)+'</div></div>';
    } else if(data.type === 'color'){
      inner += '<div class="el-pin"></div>';
      inner += '<div class="el-color-frame" style="background:'+data.hex+';"><span class="el-color-tag">#'+data.hex.replace('#','').toUpperCase()+'</span></div>';
    }
    inner += '<div class="resize-handle"></div>';
    node.innerHTML = inner;

    $('#canvas').appendChild(node);
    attachElementBehavior(node, data);
  }

  function refreshElementNode(data){
    var node = $('#el-' + data.id);
    if(!node) return;
    node.style.left = data.x + 'px';
    node.style.top = data.y + 'px';
    node.style.width = data.w + 'px';
    node.style.height = data.h + 'px';
    node.style.transform = 'rotate(' + data.rotation + 'deg)';
    if(data.type === 'image'){
      var img = node.querySelector('.el-img-wrap');
      img.innerHTML = data.src ? '<img src="'+data.src+'" alt="">' : '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:11px;color:var(--ink-soft);font-family:Space Mono,monospace;">chargement...</div>';
    } else if(data.type === 'color'){
      var frame = node.querySelector('.el-color-frame');
      frame.style.background = data.hex;
      frame.querySelector('.el-color-tag').textContent = '#' + data.hex.replace('#','').toUpperCase();
    } else if(data.type === 'text'){
      var content = node.querySelector('.el-text-content');
      content.style.fontFamily = data.font;
      content.style.fontSize = data.size + 'px';
      content.style.color = data.color;
    }
  }

  function attachElementBehavior(node, data){
    var dragging = false, resizing = false;
    var startX, startY, startLeft, startTop, startW, startH;

    node.addEventListener('pointerdown', function(e){
      if(e.target.closest('.resize-handle')){
        resizing = true;
        node.setPointerCapture(e.pointerId);
        startX = e.clientX; startY = e.clientY;
        startW = data.w; startH = data.h;
        e.stopPropagation();
        return;
      }
      if(e.target.closest('.el-toolbar')) return;
      if(e.target.isContentEditable) { selectElement(data.id); return; }
      dragging = true;
      node.classList.add('dragging');
      node.setPointerCapture(e.pointerId);
      startX = e.clientX; startY = e.clientY;
      startLeft = data.x; startTop = data.y;
      selectElement(data.id);
    });

    node.addEventListener('pointermove', function(e){
      if(dragging){
        var dx = e.clientX - startX, dy = e.clientY - startY;
        data.x = Math.max(0, startLeft + dx);
        data.y = Math.max(0, startTop + dy);
        node.style.left = data.x + 'px';
        node.style.top = data.y + 'px';
      } else if(resizing){
        var ddx = e.clientX - startX, ddy = e.clientY - startY;
        data.w = Math.max(80, startW + ddx);
        data.h = Math.max(80, startH + ddy);
        node.style.width = data.w + 'px';
        node.style.height = data.h + 'px';
      }
    });

    function endInteraction(e){
      if(dragging || resizing){
        markDirty();
        repositionToolbar(data.id);
      }
      dragging = false; resizing = false;
      node.classList.remove('dragging');
      try{ node.releasePointerCapture(e.pointerId); }catch(err){}
    }
    node.addEventListener('pointerup', endInteraction);
    node.addEventListener('pointercancel', endInteraction);

    if(data.type === 'text'){
      var contentEl = node.querySelector('.el-text-content');
      contentEl.addEventListener('input', function(){
        data.content = contentEl.textContent;
        markDirty();
      });
      contentEl.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
    }
  }

  // ---- selection + contextual toolbar ----
  function selectElement(id){
    state.selectedId = id;
    $all('.el').forEach(function(n){ n.classList.remove('selected'); });
    var existingToolbar = $('.el-toolbar');
    if(existingToolbar) existingToolbar.remove();
    var node = $('#el-' + id);
    if(!node) return;
    node.classList.add('selected');
    buildElementToolbar(getEl(id), node);

    document.addEventListener('pointerdown', dismissOnOutside, {capture:true});
  }

  function dismissOnOutside(e){
    if(!state.selectedId) return;
    var node = $('#el-' + state.selectedId);
    if(node && !node.contains(e.target)){
      node.classList.remove('selected');
      var t = $('.el-toolbar');
      if(t) t.remove();
      state.selectedId = null;
      document.removeEventListener('pointerdown', dismissOnOutside, {capture:true});
    }
  }

  function buildElementToolbar(data, node){
    var tb = document.createElement('div');
    tb.className = 'el-toolbar';

    var delBtn = document.createElement('button');
    delBtn.title = 'Supprimer';
    delBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';
    delBtn.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
    delBtn.addEventListener('click', function(){
      state.board.elements = state.board.elements.filter(function(e){ return e.id !== data.id; });
      node.remove();
      tb.remove();
      state.selectedId = null;
      updateEmptyHint();
      markDirty();
    });
    tb.appendChild(delBtn);

    var dupBtn = document.createElement('button');
    dupBtn.title = 'Dupliquer';
    dupBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
    dupBtn.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
    dupBtn.addEventListener('click', function(){
      var clone = JSON.parse(JSON.stringify(data));
      clone.id = uid();
      clone.x += 24; clone.y += 24;
      state.board.elements.push(clone);
      renderElement(clone);
      markDirty();
      selectElement(clone.id);
    });
    tb.appendChild(dupBtn);

    if(data.type === 'text'){
      var fontSel = document.createElement('select');
      FONTS.forEach(function(f){
        var opt = document.createElement('option');
        opt.value = f.value; opt.textContent = f.label;
        if(f.value === data.font) opt.selected = true;
        fontSel.appendChild(opt);
      });
      fontSel.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
      fontSel.addEventListener('change', function(){
        data.font = fontSel.value;
        refreshElementNode(data);
        markDirty();
      });
      tb.appendChild(fontSel);

      var colorInput = document.createElement('input');
      colorInput.type = 'color';
      colorInput.value = data.color;
      colorInput.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
      colorInput.addEventListener('input', function(){
        data.color = colorInput.value;
        refreshElementNode(data);
        markDirty();
      });
      tb.appendChild(colorInput);

      var sizeSel = document.createElement('select');
      [14,16,18,22,28,36,48,64].forEach(function(s){
        var opt = document.createElement('option');
        opt.value = s; opt.textContent = s + 'px';
        if(s === data.size) opt.selected = true;
        sizeSel.appendChild(opt);
      });
      sizeSel.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
      sizeSel.addEventListener('change', function(){
        data.size = parseInt(sizeSel.value, 10);
        refreshElementNode(data);
        markDirty();
      });
      tb.appendChild(sizeSel);
    }

    if(data.type === 'color'){
      var hexInput = document.createElement('input');
      hexInput.type = 'color';
      hexInput.value = data.hex;
      hexInput.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
      hexInput.addEventListener('input', function(){
        data.hex = hexInput.value;
        refreshElementNode(data);
        markDirty();
      });
      tb.appendChild(hexInput);
    }

    node.appendChild(tb);
    positionToolbarWithinView(tb, node);
  }

  function repositionToolbar(id){
    var tb = $('.el-toolbar');
    var node = $('#el-' + id);
    if(tb && node) positionToolbarWithinView(tb, node);
  }
  function positionToolbarWithinView(tb, node){
    tb.style.left = '50%';
    tb.style.top = '-42px';
    tb.style.transform = 'translateX(-50%)';
  }

  // ---- toolbar actions ----
  $('#btn-add-text').addEventListener('click', function(){ addElement('text'); });
  $('#btn-add-color').addEventListener('click', function(){ addElement('color'); });
  $('#btn-add-image').addEventListener('click', function(){ $('#file-input').click(); });

  $('#file-input').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    e.target.value = '';
    compressImage(file, 900, 0.72).then(function(dataUrl){
      var el = addElement('image');
      el.src = dataUrl;
      refreshElementNode(el);
    }).catch(function(){
      toast("Impossible de lire cette image.");
    });
  });

  function compressImage(file, maxW, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(ev){
        var img = new Image();
        img.onload = function(){
          var scale = Math.min(1, maxW / img.width);
          var w = Math.round(img.width * scale);
          var h = Math.round(img.height * scale);
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = ev.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ---- save ----
  $('#btn-save').addEventListener('click', saveBoard);

  async function saveBoard(){
    var payloadSize = JSON.stringify(state.board.elements).length;
    if(payloadSize > 4500000){
      toast("Ce moodboard est trop volumineux (trop d'images). Réduis-en le nombre.");
      return;
    }
    $('#save-status').textContent = 'enregistrement...';

    var row = {
      user_id: state.user.id,
      name: state.board.name,
      elements: state.board.elements,
      updated_at: new Date().toISOString()
    };

    var res;
    if(state.board.id){
      res = await supabase.from('moodboards').update(row).eq('id', state.board.id).select().single();
    } else {
      res = await supabase.from('moodboards').insert(row).select().single();
    }

    if(res.error){
      toast("L'enregistrement a échoué, réessaie.");
      $('#save-status').textContent = 'non enregistré';
      return;
    }

    state.board.id = res.data.id;
    state.savedSnapshot = JSON.stringify(state.board.elements);
    $('#save-status').textContent = 'enregistré';
    toast('Moodboard « ' + state.board.name + ' » enregistré.');
  }

  window.addEventListener('beforeunload', function(e){
    if(hasUnsavedChanges()){
      e.preventDefault();
      e.returnValue = '';
    }
  });

  // ---------- INIT ----------
  renderAuthScreen();

})();
</script>
